version: '3.8'

services:
  backend:
    build:
      context: ./backend/IntuneManagement
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/intune_management.db
    volumes:
      - ./backend/IntuneManagement/appsettings.json:/app/appsettings.json
      - intune-data:/app/data
      - intune-packages:/tmp/intune-packages
    networks:
      - intune-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - intune-network

volumes:
  intune-data:
  intune-packages:

networks:
  intune-network:
    driver: bridge
